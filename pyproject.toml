[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Fixes the Hatchling build error by defining the source package
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Replaces the deprecated [tool.uv.dev-dependencies] section
[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
